name: Update CBI data

on:
  schedule:
    - cron: '23 */6 * * *' # UTC; 03:23, 09:23, 15:23, 21:23 Baghdad
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-cbi-data.yml'
      - 'extract_cbi_data.py'
      - 'sync_cbi_data.py'
      - 'cbi_data.py'
      - 'test_cbi_data.py'
      - 'input_provenance.py'
      - 'test_input_provenance.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: cbi-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify parser and last-good-data protection
        run: python -m unittest test_cbi_data test_input_provenance -v
      - name: Check the official CBI bulletin
        id: sync
        continue-on-error: true
        run: python sync_cbi_data.py
      - name: Publish validated data and check status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/cbi_latest.json data/cbi_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: check and refresh official CBI bulletin'
            git push origin HEAD:main
          fi
      - name: Summarize the check
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/cbi_status.json')
          if path.exists():
              status = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## CBI update\n\n```json\n' + json.dumps(status, ensure_ascii=False, indent=2) + '\n```\n')
          PY
      - name: Report a failed source check
        if: steps.sync.outcome == 'failure'
        run: exit 1
